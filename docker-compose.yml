services:

  prototype:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ../vibe-financas-magicas:/app
      - prototype_node_modules:/app/node_modules
    tty: true
    stdin_open: true
    command:
      - sh
      - -c
      - yarn install && yarn dev
  web:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - ./Web:/app
      - ./Site/resources/:/app/resources
      - .git:/app/.git
      - web_temp:/app/node_modules
      - web_temp:/tmp
      - web_temp:/usr/local/share/.cache
    command:
      - sh
      - -c
      - yarn install && yarn start

  proxy:
    restart: always
    image: node:24-alpine
    working_dir: /app
    volumes:
      - proxy_temp:/app/node_modules
      - proxy_temp:/tmp
      - proxy_temp:/usr/local/share/.cache
      - ./firebase.json:/firebase.json:ro
      - ./Web/proxy:/app
    ports:
      - "443:4433"
      - "80:8080"
    command:
      - sh
      - -c
      - yarn install && yarn proxy
    env_file:
      - ./.basicAuth.env

  backend-builder:
    image: node:24-alpine
    working_dir: /app/Backend
    volumes:
      - ./Backend:/app/Backend
      - backend_temp:/app/Backend/node_modules
    command: yarn docker

  firebase:
    build:
      context: ./Firebase
    volumes:
      - ./.firebaserc:/app/.firebaserc
      - ./firebase.json:/app/firebase.json
      - ./Firebase:/app/Firebase
      - ./Backend:/app/Backend
      - ./Backend/.env.local:/app/.env.local
      - backend_temp:/app/Backend/node_modules
      - backend_temp:/tmp
      - backend_temp:/usr/local/share/.cache
    ports:
      - "8004:8004" # Auth
      - "8006:8006" # Functions
      - "8008:8008" # Firestore
      - "8010:8010" # Hosting
      - "4000:4000" # Emulator UI
      - "4400:4400" # Hub
      - "4500:4500" # Other reserved ports
      - "9150:9150" # Other reserved ports
      - "9299:9299" # ???
    command: sh /app/Firebase/start-emulators.sh

volumes:
  proxy_temp:
  web_temp:
  prototype_node_modules:
  backend_temp:
